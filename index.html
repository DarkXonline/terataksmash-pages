<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API POST Request Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-entry {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen py-6 px-4 font-sans selection:bg-blue-500/30">

    <div class="max-w-5xl mx-auto bg-gray-900 rounded-2xl shadow-2xl border border-gray-800 overflow-hidden flex flex-col h-[92vh]">
        
        <!-- Header -->
        <div class="bg-gray-800 px-6 py-4 border-b border-gray-700 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shrink-0">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    API POST Tester
                </h1>
                <p class="text-xs text-gray-400 mt-1 font-mono break-all">
                    POST https://teratak-pb.07102020.xyz/api/collections/taps/records
                </p>
            </div>
            <div id="auto-status-badge" class="hidden px-3 py-1 rounded-full text-xs font-semibold tracking-wide border bg-blue-500/10 text-blue-400 border-blue-500/20 uppercase items-center justify-center whitespace-nowrap animate-pulse">
                Auto-Submit Active
            </div>
        </div>

        <div class="p-6 overflow-y-auto custom-scrollbar shrink-0 border-b border-gray-800 bg-gray-900/50">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                
                <!-- State Input -->
                <div class="space-y-2 border border-gray-800 p-4 rounded-xl bg-gray-900">
                    <label for="state-input" class="block text-sm font-medium text-gray-300">State</label>
                    <input type="text" id="state-input" value="perlis" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 font-mono text-sm text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                </div>

                <!-- ID Input Block -->
                <div class="space-y-2 border border-gray-800 p-4 rounded-xl bg-gray-900">
                    <label for="id-input" class="block text-sm font-medium text-gray-300">Record ID</label>
                    <input type="text" id="id-input" maxlength="15" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 font-mono text-sm text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                    <label class="flex items-center space-x-2 mt-2 cursor-pointer group w-fit">
                        <input type="checkbox" id="chk-rand-id" class="rounded border-gray-600 text-blue-500 focus:ring-blue-500 bg-gray-950 w-4 h-4" checked>
                        <span class="text-xs text-gray-400 group-hover:text-gray-200 transition-colors">Auto-randomize Record ID</span>
                    </label>
                </div>

                <!-- Player Input Block -->
                <div class="space-y-2 border border-gray-800 p-4 rounded-xl bg-gray-900">
                    <label for="player-input" class="block text-sm font-medium text-gray-300">Player</label>
                    <input type="text" id="player-input" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 font-mono text-sm text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                    <label class="flex items-center space-x-2 mt-2 cursor-pointer group w-fit">
                        <input type="checkbox" id="chk-rand-player" class="rounded border-gray-600 text-blue-500 focus:ring-blue-500 bg-gray-950 w-4 h-4" checked>
                        <span class="text-xs text-gray-400 group-hover:text-gray-200 transition-colors">Auto-randomize Player</span>
                    </label>
                </div>

                <!-- Delta Input Block -->
                <div class="space-y-3 border border-gray-800 p-4 rounded-xl bg-gray-900 lg:col-span-1">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-medium text-gray-300">Delta Value</label>
                        <div class="flex bg-gray-950 p-1 rounded-lg border border-gray-800">
                            <label class="cursor-pointer relative">
                                <input type="radio" name="delta-mode" value="manual" class="peer sr-only" checked>
                                <div class="px-3 py-1 rounded-md text-xs font-medium text-gray-500 peer-checked:bg-blue-600/20 peer-checked:text-blue-400 transition-all">Manual</div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="delta-mode" value="random" class="peer sr-only">
                                <div class="px-3 py-1 rounded-md text-xs font-medium text-gray-500 peer-checked:bg-blue-600/20 peer-checked:text-blue-400 transition-all">Random Range</div>
                            </label>
                        </div>
                    </div>
                    <div id="delta-manual-section" class="transition-all">
                        <input type="number" id="delta-input" value="4" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 font-mono text-sm text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div id="delta-random-section" class="hidden transition-all">
                        <div class="flex items-center gap-2">
                            <input type="number" id="delta-min" value="30" placeholder="Min" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <span class="text-gray-500 text-xs">to</span>
                            <input type="number" id="delta-max" value="100" placeholder="Max" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Auto-Submit Block -->
                <div class="space-y-4 border border-blue-900/40 p-4 rounded-xl bg-blue-900/10 relative overflow-hidden">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-3 cursor-pointer group">
                            <div class="relative">
                                <input type="checkbox" id="chk-auto-submit" class="sr-only peer">
                                <div class="w-10 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                            </div>
                            <span class="text-sm font-semibold text-blue-300 group-hover:text-blue-200 transition-colors">Enable Auto-Submit</span>
                        </label>
                    </div>
                    <div class="flex items-center gap-3">
                        <label for="auto-interval" class="text-sm text-gray-400">Interval (ms):</label>
                        <input type="number" id="auto-interval" value="1000" min="1" step="1" class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 font-mono text-sm text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <!-- Error Handling Block -->
                <div class="space-y-4 border border-rose-900/30 p-4 rounded-xl bg-rose-900/5">
                    <div class="flex items-center gap-2 mb-1">
                        <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <h3 class="text-sm font-medium text-rose-300">Error Handling</h3>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="pause-seconds" class="text-xs text-gray-400">Pause on 429 / Network Error (seconds):</label>
                        <input type="number" id="pause-seconds" value="3" min="1" step="1" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 font-mono text-sm text-gray-100 focus:ring-2 focus:ring-rose-500 outline-none">
                    </div>
                </div>

            </div>

            <button id="btn-submit" class="w-full mt-6 relative overflow-hidden bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg transition-all active:scale-[0.99] flex justify-center items-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed">
                <svg id="icon-send" class="w-5 h-5 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                <span id="btn-text">Send POST Request</span>
            </button>
        </div>

        <!-- Response History Log -->
        <div class="bg-[#0a0d14] flex-1 flex flex-col min-h-[300px] overflow-hidden relative">
            <div class="px-6 py-2.5 bg-gray-900 border-b border-gray-800 flex justify-between items-center z-10">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    Log Output
                </h3>
                <button id="btn-clear-log" class="text-xs text-gray-500 hover:text-gray-300 transition-colors px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded">Clear</button>
            </div>
            
            <div id="log-container" class="flex-1 p-4 space-y-3 overflow-y-auto custom-scrollbar">
                <!-- Empty State -->
                <div id="log-empty-state" class="h-full flex flex-col items-center justify-center text-gray-600">
                    <svg class="w-10 h-10 mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2m-4-1v8m0 0l3-3m-3 3L9 8m-5 5h2.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293h3.172a1 1 0 00.707-.293l2.414-2.414a1 1 0 01.707-.293H20"></path></svg>
                    <p class="text-sm">Requests will appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = {
                state: document.getElementById('state-input'),
                id: document.getElementById('id-input'),
                player: document.getElementById('player-input'),
                deltaManual: document.getElementById('delta-input'),
                deltaMin: document.getElementById('delta-min'),
                deltaMax: document.getElementById('delta-max'),
                autoInterval: document.getElementById('auto-interval'),
                pauseSeconds: document.getElementById('pause-seconds')
            };
            
            const checks = {
                randId: document.getElementById('chk-rand-id'),
                randPlayer: document.getElementById('chk-rand-player'),
                autoSubmit: document.getElementById('chk-auto-submit')
            };

            const ui = {
                btnSubmit: document.getElementById('btn-submit'),
                btnText: document.getElementById('btn-text'),
                logContainer: document.getElementById('log-container'),
                logEmptyState: document.getElementById('log-empty-state'),
                btnClearLog: document.getElementById('btn-clear-log'),
                autoStatusBadge: document.getElementById('auto-status-badge'),
                sections: {
                    manual: document.getElementById('delta-manual-section'),
                    random: document.getElementById('delta-random-section')
                }
            };

            const ENDPOINT_URL = "https://teratak-pb.07102020.xyz/api/collections/taps/records";
            let isAutoRunning = false;

            const generateId = () => {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 15; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            };

            const generateUUID = () => {
                if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            };

            const getTimestamp = () => {
                const now = new Date();
                return now.toLocaleTimeString() + '.' + now.getMilliseconds().toString().padStart(3, '0');
            };

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            // Initialize defaults
            inputs.id.value = generateId();
            inputs.player.value = `web:${generateUUID()}`;

            document.getElementsByName('delta-mode').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'manual') {
                        ui.sections.manual.classList.remove('hidden');
                        ui.sections.random.classList.add('hidden');
                    } else {
                        ui.sections.manual.classList.add('hidden');
                        ui.sections.random.classList.remove('hidden');
                    }
                });
            });

            ui.btnClearLog.addEventListener('click', () => {
                ui.logContainer.innerHTML = '';
                ui.logEmptyState.style.display = 'flex';
                ui.logContainer.appendChild(ui.logEmptyState);
            });

            async function performRequest() {
                // Update specific inputs if randomizers are checked
                if (checks.randId.checked) inputs.id.value = generateId();
                if (checks.randPlayer.checked) inputs.player.value = `web:${generateUUID()}`;
                
                let deltaVal;
                const isManual = document.querySelector('input[name="delta-mode"]:checked').value === 'manual';
                
                if (isManual) {
                    deltaVal = parseFloat(inputs.deltaManual.value);
                } else {
                    const min = parseFloat(inputs.deltaMin.value);
                    const max = parseFloat(inputs.deltaMax.value);
                    deltaVal = Math.floor(Math.random() * (max - min + 1)) + min;
                }

                const payload = {
                    id: inputs.id.value,
                    state: inputs.state.value || "perlis",
                    delta: deltaVal || 0,
                    player: inputs.player.value
                };

                let responseData;
                let status;
                let isError = false;
                let isRateLimitedOrNetworkErr = false;

                try {
                    const response = await fetch(ENDPOINT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    status = response.status;
                    isError = !response.ok;
                    
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.includes("application/json")) {
                        responseData = await response.json();
                    } else {
                        responseData = await response.text();
                    }

                    if (status === 429) {
                        isRateLimitedOrNetworkErr = true;
                    }

                    appendLog(payload, responseData, status, isError);

                } catch (error) {
                    // Network errors land here
                    isError = true;
                    isRateLimitedOrNetworkErr = true;
                    status = "ERR";
                    responseData = error.message;
                    appendLog(payload, responseData, status, isError);
                }

                return isRateLimitedOrNetworkErr;
            }

            async function autoSubmitLoop() {
                while (isAutoRunning) {
                    const needsPause = await performRequest();
                    
                    if (!isAutoRunning) break; // Check if user turned it off during request

                    if (needsPause) {
                        const pauseSecs = parseFloat(inputs.pauseSeconds.value) || 3;
                        appendPauseLog(pauseSecs);
                        await sleep(pauseSecs * 1000);
                    } else {
                        const intervalMs = parseFloat(inputs.autoInterval.value) || 1000;
                        await sleep(intervalMs);
                    }
                }
            }

            checks.autoSubmit.addEventListener('change', (e) => {
                isAutoRunning = e.target.checked;
                
                if (isAutoRunning) {
                    ui.autoStatusBadge.classList.remove('hidden');
                    ui.autoStatusBadge.classList.add('flex');
                    ui.btnSubmit.disabled = true;
                    ui.btnText.textContent = "Auto-running...";
                    autoSubmitLoop(); // Start the loop
                } else {
                    ui.autoStatusBadge.classList.add('hidden');
                    ui.autoStatusBadge.classList.remove('flex');
                    ui.btnSubmit.disabled = false;
                    ui.btnText.textContent = "Send POST Request";
                }
            });

            ui.btnSubmit.addEventListener('click', async () => {
                if (!isAutoRunning) {
                    ui.btnSubmit.disabled = true;
                    ui.btnText.textContent = "Sending...";
                    await performRequest();
                    ui.btnSubmit.disabled = false;
                    ui.btnText.textContent = "Send POST Request";
                }
            });

            function appendLog(payload, response, status, isError) {
                if (ui.logEmptyState) ui.logEmptyState.style.display = 'none';

                const logEntry = document.createElement('div');
                const borderColor = isError ? 'border-rose-500/30' : 'border-emerald-500/30';
                const bgColor = isError ? 'bg-rose-500/5' : 'bg-emerald-500/5';
                const statusColor = isError ? 'text-rose-400 bg-rose-500/10' : 'text-emerald-400 bg-emerald-500/10';

                const responseText = typeof response === 'object' ? JSON.stringify(response, null, 2) : response;

                logEntry.className = `log-entry border ${borderColor} ${bgColor} rounded-lg p-3 text-xs`;
                logEntry.innerHTML = `
                    <div class="flex items-center justify-between mb-2 pb-2 border-b border-gray-800/50">
                        <span class="font-mono text-gray-500">${getTimestamp()}</span>
                        <span class="px-2 py-0.5 rounded font-bold ${statusColor}">${status}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <span class="text-gray-500 uppercase font-semibold mb-1 block">Payload</span>
                            <pre class="text-gray-400 bg-black/40 p-2 rounded overflow-x-auto border border-gray-800">${JSON.stringify(payload, null, 2)}</pre>
                        </div>
                        <div>
                            <span class="text-gray-500 uppercase font-semibold mb-1 block">Response</span>
                            <pre class="${isError ? 'text-rose-300' : 'text-gray-300'} bg-black/40 p-2 rounded overflow-x-auto border border-gray-800 max-h-32 overflow-y-auto whitespace-pre-wrap">${responseText}</pre>
                        </div>
                    </div>
                `;
                ui.logContainer.appendChild(logEntry);
                ui.logContainer.scrollTop = ui.logContainer.scrollHeight;
            }

            function appendPauseLog(seconds) {
                if (ui.logEmptyState) ui.logEmptyState.style.display = 'none';
                
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry border border-amber-500/30 bg-amber-500/5 rounded-lg p-3 text-xs flex items-center gap-2 justify-center text-amber-300`;
                logEntry.innerHTML = `
                    <svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Triggered Error Handling. Pausing auto-submit for <strong>${seconds} seconds</strong>...</span>
                `;
                ui.logContainer.appendChild(logEntry);
                ui.logContainer.scrollTop = ui.logContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
